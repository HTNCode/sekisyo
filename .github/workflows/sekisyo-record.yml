name: Sekisyo record

on:
  pull_request_target:
    types:
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    # 記録ブロックを含むPRだけ検証する。記録なしのPRはスキップ（グレー表示）になる
    if: contains(github.event.pull_request.body, '<!-- sekisyo:start:v1 -->')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted PR base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Verify the PR record
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: node .github/scripts/verify-sekisyo-record.cjs
